[bar]
order = ["top","main"]              # layer-shell creation order

[bar.top]
position           = "top"
enabled            = true
auto_hide          = false
reserve_space      = true
layer              = "top"
thickness          = 10
background_opacity = 1.0
border             = "outline"
border_width       = 0.0
shadow             = true
contact_shadow     = false
panel_overlap      = 1
radius             = 12
radius_top_left    = 12
radius_top_right   = 12
radius_bottom_left = -12
radius_bottom_right = -12
margin_ends        = 0
margin_edge        = 0
padding            = 14
widget_spacing     = 6
scale              = 4
font_weight        = "regular"
font_family        = ""

capsule            = true
capsule_fill       = "surface_variant"
capsule_thickness  = 0.76
capsule_radius     = 8.0
capsule_opacity    = 1

start  = []
center = ["control-center-top"]
end    = []

[bar.main]
position           = "left"
enabled            = true
auto_hide          = false
reserve_space      = true
layer              = "top"
thickness          = 34
background_opacity = 1.0
border             = "outline"
border_width       = 0.0
shadow             = true
contact_shadow     = false
panel_overlap      = 1
radius             = 12
radius_top_left    = 0
radius_top_right   = -12
radius_bottom_left = -12
radius_bottom_right = -12
margin_ends        = 0
margin_edge        = 0
padding            = 14
widget_spacing     = 6
scale              = 1.0
font_weight        = "regular"
font_family        = ""
capsule            = false

start  = ["clock"]
center = ["workspaces","media"]
end    = ["clipboard", "bluetooth", "volume", "brightness", "battery", "session"]